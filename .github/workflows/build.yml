name: build apk

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build android apk
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install android 36 sdk
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: setup gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: build debug apk
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: build release apk
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: 144Hz-Unlocker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: upload release apk
        uses: actions/upload-artifact@v4
        with:
          name: 144Hz-Unlocker-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
